[project]
name = "solit2"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
]

[project.scripts]
solit2 = "solit2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solit2"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["solit2"]
